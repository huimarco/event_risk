name: get_security_prices

on:
  schedule:
    - cron: "30 22 * * 1-5"   # UTC, after the US close; Asian closes from the same day are final by then
  workflow_dispatch:

concurrency:
  group: get_security_prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # ~550 tickers + 42 factor series; the first run loads history since 2020
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python prices.py
        env:
          DB: md:geo_odds
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      - run: python factor_betas.py   # re-measure question -> factor sensitivities with the new day's levels
        env:
          DB: md:geo_odds
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      - run: python security_betas.py   # factor loadings + question -> security sensitivities, from prices
        env:
          DB: md:geo_odds
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      - run: python event_betas.py   # every issuer and macro factor vs every event with data (Issuer / Macro dashboards)
        env:
          DB: md:geo_odds
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
